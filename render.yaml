services:
  - type: web
    name: smart-study-notes-generator
    env: python
    buildCommand: pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: python web_server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MODEL_NAME
        value: t5-small
